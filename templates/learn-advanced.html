<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>🎯 学习新单词 - 背单词</title>
    <!-- 缓存破坏：每次修改后更新时间戳 -->
    <meta name="version" content="2026-05-04-0205">
    
    <!-- vConsole: 移动端调试工具 -->
    <script src="https://unpkg.com/vconsole@latest/dist/vconsole.min.js"></script>
    <script>
        // 初始化 vConsole
        var vConsole = new window.VConsole({
            defaultPlugins: ['system', 'network', 'element', 'storage'],
            maxLogNumber: 1000,
        });
        console.log('🦋 vConsole 已初始化');
    </script>
    <script>
        // 页面加载时同步后端计数
        window.addEventListener('load', async function() {
            console.log('🦋 页面加载完成！');
            console.log('📊 localStorage:', localStorage.getItem('vocabulary_completed'));
            // 同步后端计数（修复之前的 bug）
            if (typeof syncCompletedCount === 'function') {
                await syncCompletedCount();
            }
        });
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 600px; margin: 0 auto; }
        header { text-align: center; color: white; margin-bottom: 30px; }
        header h1 { font-size: 2em; margin-bottom: 10px; }
        .back-btn {
            display: inline-block; color: white; text-decoration: none;
            padding: 10px 20px; background: rgba(255,255,255,0.2);
            border-radius: 20px; margin-bottom: 20px;
        }
        .back-btn:hover { background: rgba(255,255,255,0.3); }
        
        .completed-badge {
            display: inline-block; background: rgba(76, 175, 80, 0.9);
            color: white; padding: 8px 16px; border-radius: 20px;
            font-size: 0.9em; font-weight: bold; margin-left: 15px;
        }
        .card {
            background: white; border-radius: 15px; padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .word-card { text-align: center; padding: 30px 0; }
        .word { font-size: 3em; font-weight: bold; color: #333; margin-bottom: 20px; }
        .stage-badge {
            display: inline-block; background: #667eea; color: white;
            padding: 5px 15px; border-radius: 15px; font-size: 0.8em;
            margin-bottom: 15px;
        }
        .relearn-badge {
            display: inline-block; background: #f5576c; color: white;
            padding: 5px 15px; border-radius: 15px; font-size: 0.8em;
            margin-bottom: 15px;
        }
        .meaning { font-size: 1.5em; color: #667eea; margin-bottom: 20px; display: none; }
        .example { color: #888; font-style: italic; margin-top: 20px; display: none; }
        .btn-group { display: flex; gap: 15px; justify-content: center; margin-top: 30px; }
        .btn {
            padding: 15px 40px; border: none; border-radius: 10px;
            cursor: pointer; font-size: 1.1em; transition: all 0.3s;
        }
        .btn-show { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-know { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); color: white; }
        .btn-forget { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); color: white; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .progress { text-align: center; color: white; margin-top: 20px; }
        .message { text-align: center; color: white; font-size: 1.5em; padding: 40px; }
        .hidden { display: none; }
        
        /* 选择题样式 */
        .options-grid { display: grid; gap: 10px; margin-top: 20px; }
        .option-btn {
            padding: 15px; border: 2px solid #e0e0e0; border-radius: 10px;
            background: white; cursor: pointer; font-size: 1em;
            transition: all 0.3s; text-align: left;
            word-wrap: break-word; overflow-wrap: break-word;
        }
        .option-btn:hover { border-color: #667eea; background: #f8f9ff; }
        .option-btn.correct { background: #d4edda; border-color: #28a745; }
        .option-btn.wrong { background: #f8d7da; border-color: #dc3545; }
        
        /* 拼写输入框 */
        .spelling-input {
            width: 100%; padding: 15px; font-size: 1.2em;
            border: 2px solid #e0e0e0; border-radius: 10px;
            margin-top: 20px; text-align: center;
            word-wrap: break-word; overflow-wrap: break-word;
            box-sizing: border-box;
            background: white; cursor: text;
        }
        .spelling-input:focus { outline: none; border-color: #667eea; }
        .spelling-input:empty:before {
            content: attr(placeholder);
            color: #999;
        }
        
        /* 长单词自适应 */
        .word {
            word-wrap: break-word;
            overflow-wrap: break-word;
            word-break: break-word;
            hyphens: auto;
        }
        
        /* 反馈信息 */
        .feedback {
            text-align: center; padding: 20px; margin-top: 20px;
            border-radius: 10px; font-size: 1.2em;
        }
        .feedback.correct { background: #d4edda; color: #155724; }
        .feedback.wrong { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-btn">← 返回首页</a>
        
        <header>
            <h1>🎯 学习新单词</h1>
            <p id="stage-desc">多阶段记忆训练</p>
            <div class="completed-badge" id="completed-badge">已完成：<span id="completed-count">0</span></div>
        </header>
        
        <div class="card" id="word-card">
            <div class="word-card">
                <div class="relearn-badge hidden" id="relearn-badge">🔁 重学单词</div>
                <div class="stage-badge hidden" id="stage-badge">阶段 1/4</div>
                <div class="word" id="word">加载中...</div>
                <div class="meaning" id="meaning"></div>
                <div class="example" id="example"></div>
            </div>
            
            <!-- 阶段 1: 初次学习 -->
            <div class="btn-group" id="btn-group-stage1">
                <button class="btn btn-show" onclick="showMeaning()">显示释义</button>
            </div>
            <div class="btn-group hidden" id="answer-group-stage1">
                <button class="btn btn-forget" onclick="completeLearning(false)">不认识</button>
                <button class="btn btn-know" onclick="completeLearning(true)">认识</button>
            </div>
            
            <!-- 阶段 2&3: 选择题 -->
            <div class="btn-group hidden" id="btn-group-quiz">
                <div class="options-grid" id="options-grid"></div>
            </div>
            
            <!-- 阶段 3: 拼写英文 -->
            <div class="btn-group hidden" id="btn-group-spelling">
                <div class="spelling-input" id="spelling-input" contenteditable="true" placeholder="输入单词拼写..." style="min-height: 50px; line-height: 50px;"></div>
                <button class="btn btn-know" style="margin-top: 15px;" onclick="submitSpelling()">提交</button>
            </div>
            
            <!-- 阶段 4: 拼写中文释义 -->
            <div class="btn-group hidden" id="btn-group-spelling-meaning">
                <div class="spelling-input" id="spelling-meaning-input" contenteditable="true" placeholder="输入中文释义..." style="min-height: 50px; line-height: 50px;"></div>
                <button class="btn btn-know" style="margin-top: 15px;" onclick="submitSpellingMeaning()">提交</button>
            </div>
            
            <!-- 反馈 -->
            <div class="feedback hidden" id="feedback"></div>
        </div>
        
        <div class="message hidden" id="complete-message">
            🎉 太棒了！<br>
            <p style="font-size: 0.8em; margin-top: 20px;">你已经学完这本词书的所有单词！</p>
            <a href="/books" class="btn btn-show" style="margin-top: 20px; display: inline-block; text-decoration: none;">选择其他词书</a>
        </div>
        
        <div class="progress" id="progress"></div>
    </div>
    
    <script>
        let currentWord = null;
        let learnedCount = 0;
        const bookId = {{ book_id }};
        
        // 获取今天的日期字符串（YYYY-MM-DD）
        function getTodayStr() {
            return new Date().toISOString().split('T')[0];
        }
        
        // 从 localStorage 加载今日已完成计数
        function loadTodayCompleted() {
            const today = getTodayStr();
            const stored = localStorage.getItem('vocabulary_completed');
            if (stored) {
                const data = JSON.parse(stored);
                if (data.date === today) {
                    return data.count || 0;
                }
            }
            return 0;
        }
        
        // 从后端同步已完成计数（修复之前的 bug）
        async function syncCompletedCount() {
            try {
                const response = await fetch('/api/review/stats');
                const stats = await response.json();
                const backendCompleted = stats.total_learned || 0;
                
                const today = getTodayStr();
                const stored = localStorage.getItem('vocabulary_completed');
                let localCount = 0;
                if (stored) {
                    const data = JSON.parse(stored);
                    if (data.date === today) {
                        localCount = data.count || 0;
                    }
                }
                
                console.log('📊 后端已完成:', backendCompleted);
                console.log('📊 本地已完成:', localCount);
                
                // 如果后端计数大于本地，说明之前有 bug，同步后端数据
                if (backendCompleted > localCount) {
                    console.log('🔄 同步后端计数到本地：', backendCompleted);
                    sessionCompleted = backendCompleted;
                    saveTodayCompleted(backendCompleted);
                    updateCompletedCount();
                }
            } catch (error) {
                console.error('❌ 同步计数失败:', error);
            }
        }
        
        // 保存今日已完成计数到 localStorage
        function saveTodayCompleted(count) {
            const today = getTodayStr();
            localStorage.setItem('vocabulary_completed', JSON.stringify({
                date: today,
                count: count
            }));
        }
        
        // 本次会话已完成的单词数（跨刷新，24 点重置）
        let sessionCompleted = loadTodayCompleted();
        
        // 更新已完成计数显示
        function updateCompletedCount() {
            console.log('📊 更新计数：', sessionCompleted);
            document.getElementById('completed-count').textContent = sessionCompleted;
            saveTodayCompleted(sessionCompleted);
            console.log('💾 已保存到 localStorage:', JSON.stringify({ date: getTodayStr(), count: sessionCompleted }));
        }
        
        // 页面加载时恢复计数
        updateCompletedCount();
        
        // 加载下一个单词
        async function loadNextWord() {
            try {
                const response = await fetch('/api/learn/next', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ book_id: bookId })
                });
                const data = await response.json();
                
                if (data.message) {
                    document.getElementById('word-card').style.display = 'none';
                    hideAllBtnGroups();
                    document.getElementById('complete-message').classList.remove('hidden');
                    document.getElementById('progress').textContent = '';
                    return;
                }
                
                currentWord = data;
                // 重学单词时，阶段始终为 0（阶段 1）
                const stage = data.is_relearn ? 0 : (data.stage || 0);
                
                // 显示徽章
                document.getElementById('relearn-badge').classList.toggle('hidden', !data.is_relearn);
                const stageBadge = document.getElementById('stage-badge');
                const stageDesc = document.getElementById('stage-desc');
                
                if (data.is_relearn) {
                    // 重学单词：显示阶段 1
                    stageBadge.textContent = '阶段 1/4';
                    stageBadge.classList.remove('hidden');
                    stageDesc.textContent = '多阶段记忆训练（4 阶段 + 间隔 15 词）';
                } else if (stage > 0 && stage < 4) {
                    const progress = data.words_since_stage || 0;
                    stageBadge.textContent = `阶段${stage + 1}/4 (已间隔${progress}/15)`;
                    stageBadge.classList.remove('hidden');
                    stageDesc.textContent = `再学习${15 - progress}个其他单词后进入下一阶段`;
                } else if (stage === 0) {
                    stageBadge.classList.add('hidden');
                    stageDesc.textContent = '多阶段记忆训练（4 阶段 + 间隔 15 词）';
                } else {
                    stageBadge.classList.add('hidden');
                }
                
                // 重置显示
                document.getElementById('word').textContent = data.word;
                document.getElementById('meaning').textContent = data.meaning;
                document.getElementById('example').textContent = data.example || '';
                document.getElementById('meaning').style.display = 'none';
                document.getElementById('example').style.display = 'none';
                document.getElementById('feedback').classList.add('hidden');
                
                // 根据阶段显示不同界面
                hideAllBtnGroups();
                if (stage === 0 || data.is_relearn) {
                    // 阶段 1 或重学：看单词选择认识/不认识释义
                    document.getElementById('btn-group-stage1').classList.remove('hidden');
                } else if (stage === 1) {
                    // 阶段 2：根据单词选择释义
                    document.getElementById('word').textContent = data.word;
                    document.getElementById('meaning').style.display = 'none';
                    document.getElementById('example').style.display = 'none';
                    await loadQuiz('meaning');
                } else if (stage === 2) {
                    // 阶段 3：根据释义拼写单词
                    document.getElementById('word').textContent = '请拼写这个单词:';
                    document.getElementById('meaning').textContent = data.meaning;
                    document.getElementById('meaning').style.display = 'block';
                    document.getElementById('example').style.display = 'none';
                    document.getElementById('btn-group-spelling').classList.remove('hidden');
                    document.getElementById('spelling-input').textContent = '';
                    // 延迟聚焦，确保元素已显示
                    setTimeout(() => {
                        const input = document.getElementById('spelling-input');
                        input.focus();
                        input.click();
                    }, 300);
                } else if (stage === 3) {
                    // 阶段 4：根据单词写出中文释义
                    document.getElementById('word').textContent = data.word;
                    document.getElementById('meaning').style.display = 'none';
                    document.getElementById('example').style.display = 'none';
                    document.getElementById('btn-group-spelling-meaning').classList.remove('hidden');
                    document.getElementById('spelling-meaning-input').textContent = '';
                    // 延迟聚焦，确保元素已显示
                    setTimeout(() => {
                        const input = document.getElementById('spelling-meaning-input');
                        input.focus();
                        input.click();
                    }, 300);
                }
                
                learnedCount++;
                document.getElementById('progress').textContent = `已学习：${learnedCount} 个单词`;
                
            } catch (error) {
                console.error('加载单词失败:', error);
                document.getElementById('word').textContent = '加载失败';
            }
        }
        
        function hideAllBtnGroups() {
            ['btn-group-stage1', 'answer-group-stage1', 'btn-group-quiz', 'btn-group-spelling', 'btn-group-spelling-meaning'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
        }
        
        // 阶段 1: 显示释义
        function showMeaning() {
            document.getElementById('meaning').style.display = 'block';
            if (document.getElementById('example').textContent) {
                document.getElementById('example').style.display = 'block';
            }
            document.getElementById('btn-group-stage1').classList.add('hidden');
            document.getElementById('answer-group-stage1').classList.remove('hidden');
        }
        
        // 阶段 1: 完成学习
        async function completeLearning(known) {
            if (!currentWord) return;
            const endpoint = known ? '/api/learn/known' : '/api/learn/unknown';
            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ word_id: currentWord.id, book_id: bookId })
                });
                if (response.ok) {
                    // 更新间隔计数
                    await fetch('/api/learn/update-intervals', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ book_id: bookId })
                    });
                    loadNextWord();
                }
            } catch (error) {
                console.error('保存失败:', error);
            }
        }
        
        // 阶段 2&3: 加载选择题
        async function loadQuiz(questionType) {
            try {
                const response = await fetch('/api/learn/generate-options', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ word_id: currentWord.id, question_type: questionType })
                });
                const data = await response.json();
                
                const grid = document.getElementById('options-grid');
                grid.innerHTML = '';
                
                if (questionType === 'meaning') {
                    // 显示单词，选择释义
                    document.getElementById('word').textContent = data.word;
                    document.getElementById('meaning').style.display = 'none';
                } else {
                    // 显示释义，选择单词
                    document.getElementById('word').textContent = '请选择单词:';
                    document.getElementById('meaning').textContent = data.meaning;
                    document.getElementById('meaning').style.display = 'block';
                }
                
                data.options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.textContent = opt;
                    btn.onclick = () => submitQuizAnswer(btn, opt, data.correct);
                    grid.appendChild(btn);
                });
                
                document.getElementById('btn-group-quiz').classList.remove('hidden');
                
            } catch (error) {
                console.error('加载题目失败:', error);
            }
        }
        
        // 阶段 2&3: 提交答案
        async function submitQuizAnswer(btnElement, userAnswer, correctAnswer) {
            const isCorrect = userAnswer.trim().toLowerCase() === correctAnswer.trim().toLowerCase();
            
            // 禁用所有按钮
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(b => b.disabled = true);
            
            if (isCorrect) {
                btnElement.classList.add('correct');
                showFeedback('✅ 正确！', true);
            } else {
                btnElement.classList.add('wrong');
                showFeedback(`❌ 正确答案：${correctAnswer}`, false);
            }
            
            // 提交到后端
            try {
                const response = await fetch('/api/learn/answer', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        word_id: currentWord.id,
                        book_id: bookId,
                        question_type: currentWord.stage === 1 ? 'meaning' : 'word',
                        answer: userAnswer,
                        correct: correctAnswer
                    })
                });
                const result = await response.json();
                
                setTimeout(async () => {
                    console.log('📊 Quiz 提交结果:', result);
                    console.log('📊 result.completed:', result.completed);
                    console.log('📊 当前 sessionCompleted:', sessionCompleted);
                    
                    if (result.completed) {
                        showFeedback('🎉 已完成学习！加入复习计划！', true);
                        // 更新本次会话的已完成计数
                        sessionCompleted++;
                        console.log('📊 计数增加后 sessionCompleted:', sessionCompleted);
                        updateCompletedCount();
                    } else if (result.correct) {
                        showFeedback(`✅ 正确！${result.message || ''}`, true);
                    } else {
                        showFeedback(`❌ 正确答案：${result.correct_answer}，已重置回阶段 1`, false);
                    }
                    
                    // 更新间隔计数
                    await fetch('/api/learn/update-intervals', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ book_id: bookId })
                    });
                    
                    setTimeout(loadNextWord, 2000);
                }, 1000);
                
            } catch (error) {
                console.error('提交失败:', error);
                setTimeout(loadNextWord, 1500);
            }
        }
        
        // 阶段 3: 拼写英文
        async function submitSpelling() {
            const input = document.getElementById('spelling-input');
            const userAnswer = (input.innerText || input.textContent).trim();
            if (!userAnswer) {
                alert('请输入单词拼写！');
                input.focus();
                return;
            }
            
            // 模糊匹配：忽略空格和标点符号（支持短语拼写）
            function normalizeSpelling(text) {
                // 移除所有空格和标点符号，只保留字母
                return text.toLowerCase().replace(/[\s\-\.\,\!\?]+/g, '');
            }
            
            const normalizedUser = normalizeSpelling(userAnswer);
            const normalizedCorrect = normalizeSpelling(currentWord.word);
            
            // 调试日志
            console.log('📝 英文拼写输入:', JSON.stringify(userAnswer));
            console.log('📝 英文正确答案:', JSON.stringify(currentWord.word));
            console.log('📝 标准化后输入:', normalizedUser);
            console.log('📝 标准化后正确:', normalizedCorrect);
            console.log('📝 是否匹配:', normalizedUser === normalizedCorrect);
            
            const isCorrect = normalizedUser === normalizedCorrect;
            
            // 提交到后端
            const response = await fetch('/api/learn/answer', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    word_id: currentWord.id,
                    book_id: bookId,
                    question_type: 'spelling',
                    answer: userAnswer,
                    correct: currentWord.word
                })
            });
            
            const result = await response.json();
            
            // 更新间隔计数
            await fetch('/api/learn/update-intervals', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ book_id: bookId })
            });
            
            if (isCorrect) {
                // 检查是否完成了 4 个阶段
                if (result.completed) {
                    showFeedback('🎉 已完成学习！加入复习计划！', true);
                    // 更新本次会话的已完成计数
                    sessionCompleted++;
                    updateCompletedCount();
                } else {
                    showFeedback('✅ 拼写正确！', true);
                }
                setTimeout(() => {
                    loadNextWord();
                }, 1500);
            } else {
                showFeedback(`❌ 正确拼写：${currentWord.word}`, false);
                // 清空输入框
                input.innerText = '';
                // 显示"继续"按钮，让用户手动继续
                const continueBtn = document.createElement('button');
                continueBtn.className = 'btn btn-know';
                continueBtn.textContent = '继续';
                continueBtn.style.marginTop = '15px';
                continueBtn.onclick = () => {
                    document.getElementById('feedback').classList.add('hidden');
                    continueBtn.remove();
                    loadNextWord();
                };
                document.getElementById('feedback').appendChild(continueBtn);
            }
        }
        
        // 阶段 4: 拼写中文释义
        let isSubmitting = false;  // 防止重复提交
        
        async function submitSpellingMeaning() {
            // 防止重复提交
            if (isSubmitting) {
                console.log('⚠️ 正在提交中，请勿重复点击');
                return;
            }
            isSubmitting = true;
            
            const input = document.getElementById('spelling-meaning-input');
            // 使用 innerText 而不是 textContent，更好地获取 contenteditable 的内容
            const userAnswer = (input.innerText || input.textContent).trim();
            
            // 调试日志：输出原始输入
            console.log('📝 原始输入:', JSON.stringify(userAnswer));
            console.log('📝 输入长度:', userAnswer.length);
            console.log('📝 输入字符代码:', Array.from(userAnswer).map(c => c.charCodeAt(0).toString(16)));
            
            if (!userAnswer) {
                alert('请输入中文释义！');
                input.focus();
                isSubmitting = false;  // 重置标志
                return;
            }
            
            // 模糊匹配：中文释义忽略标点符号和空格差异
            const correctMeaning = currentWord.meaning;
            
            // 标准化函数：移除所有标点符号、特殊符号和空白字符，只保留纯文字
            function normalizeText(text) {
                // 移除所有标点符号、特殊符号（包括省略号、破折号、引号等）和所有空白字符
                // 包括中文标点、英文标点、各种引号（直引号、弯引号）、省略号、破折号、空格等
                const punctuation = /[，。、；：？！""''""""''''（）【】《》〈〉,.!?;:()\[\]{}"'`'"'"'\s…\-—–~·@#$%^&*+=|\\<>?/]/g;
                return text.replace(punctuation, '').trim();
            }
            
            const normalizedUser = normalizeText(userAnswer);
            const normalizedCorrect = normalizeText(correctMeaning);
            
            // 调试日志
            console.log('用户输入:', userAnswer);
            console.log('正确答案:', correctMeaning);
            console.log('标准化后用户:', normalizedUser);
            console.log('标准化后正确:', normalizedCorrect);
            console.log('是否匹配:', normalizedUser === normalizedCorrect);
            
            const isCorrect = normalizedUser === normalizedCorrect;
            
            // 提交到后端
            const response = await fetch('/api/learn/answer', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    word_id: currentWord.id,
                    book_id: bookId,
                    question_type: 'meaning_spelling',
                    answer: userAnswer,
                    correct: correctMeaning
                })
            });
            
            const result = await response.json();
            
            // 更新间隔计数
            await fetch('/api/learn/update-intervals', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ book_id: bookId })
            });
            
            if (isCorrect || result.completed) {
                console.log('📊 阶段 4 提交结果:', result);
                console.log('📊 result.completed:', result.completed);
                console.log('📊 当前 sessionCompleted:', sessionCompleted);
                
                // 检查是否完成了 4 个阶段
                if (result.completed) {
                    showFeedback('🎉 已完成学习！加入复习计划！', true);
                    // 更新本次会话的已完成计数
                    sessionCompleted++;
                    console.log('📊 计数增加后 sessionCompleted:', sessionCompleted);
                    updateCompletedCount();
                } else {
                    showFeedback('✅ 释义正确！', true);
                }
                setTimeout(() => {
                    isSubmitting = false;  // 重置标志位
                    loadNextWord();
                }, 1500);
            } else {
                showFeedback(`❌ 正确释义：${correctMeaning}`, false);
                // 清空输入框
                input.innerText = '';
                // 显示"继续"按钮，让用户手动继续
                const continueBtn = document.createElement('button');
                continueBtn.className = 'btn btn-know';
                continueBtn.textContent = '继续';
                continueBtn.style.marginTop = '15px';
                continueBtn.onclick = () => {
                    document.getElementById('feedback').classList.add('hidden');
                    continueBtn.remove();
                    isSubmitting = false;  // 重置标志位
                    loadNextWord();
                };
                document.getElementById('feedback').appendChild(continueBtn);
                isSubmitting = false;  // 重置标志位
            }
        }
        
        // 显示反馈
        function showFeedback(text, isCorrect) {
            const fb = document.getElementById('feedback');
            fb.textContent = text;
            fb.className = 'feedback ' + (isCorrect ? 'correct' : 'wrong');
            fb.classList.remove('hidden');
        }
        
        // 回车提交拼写
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Enter' && !document.getElementById('btn-group-spelling').classList.contains('hidden')) {
                submitSpelling();
            }
        });
        
        // 页面加载
        loadNextWord();
    </script>
</body>
</html>
