<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 背单词 - 高效记忆</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }
        
        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        header p {
            font-size: 1.2em;
            opacity: 0.9;
        }
        
        .stats-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .stat-item {
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            color: white;
        }
        
        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            display: block;
        }
        
        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
            margin-top: 5px;
        }
        
        .action-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        
        .action-btn {
            display: block;
            padding: 30px;
            border-radius: 15px;
            text-decoration: none;
            color: white;
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .action-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        
        .btn-learn {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }
        
        .btn-review {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        
        .btn-books {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }
        
        .action-btn h3 {
            font-size: 1.5em;
            margin-bottom: 10px;
        }
        
        .action-btn p {
            opacity: 0.9;
        }
        
        .review-alert {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            color: white;
            font-size: 1.2em;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
        
        .footer {
            text-align: center;
            color: white;
            margin-top: 40px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 背单词</h1>
            <p>基于艾宾浩斯遗忘曲线 · 高效记忆</p>
        </header>
        
        <div class="stats-card">
            <h2 style="margin-bottom: 20px;">📊 学习统计</h2>
            <div class="stats-grid" id="stats">
                <div class="stat-item">
                    <span class="stat-number" id="today-count">-</span>
                    <span class="stat-label">今日待复习</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number" id="total-learned">-</span>
                    <span class="stat-label">已学单词</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number" id="mastered-count">-</span>
                    <span class="stat-label">已掌握</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number" id="remaining-count">-</span>
                    <span class="stat-label">待学习</span>
                </div>
            </div>
        </div>
        
        <div id="review-alert" class="review-alert" style="display: none;">
            🔔 你有 <span id="review-count">0</span> 个单词需要复习！
        </div>
        
        <div class="action-buttons">
            <a href="/review" class="action-btn btn-review">
                <h3>📝 复习</h3>
                <p>复习今天要掌握的单词</p>
            </a>
            
            <a href="/books" class="action-btn btn-books">
                <h3>📖 词书</h3>
                <p>管理你的词书</p>
            </a>
            
            <a href="/learn/1" class="action-btn btn-learn">
                <h3>🎯 学习</h3>
                <p>学习新的单词</p>
            </a>
        </div>
        
        <div class="footer">
            <p>🦋 芭德卡特制作 · 让学习更有趣</p>
        </div>
    </div>
    
    <script>
        // 加载统计数据
        async function loadStats() {
            try {
                const response = await fetch('/api/review/stats');
                const stats = await response.json();
                
                document.getElementById('today-count').textContent = stats.today;
                document.getElementById('total-learned').textContent = stats.total_learned;
                document.getElementById('mastered-count').textContent = stats.mastered;
                document.getElementById('remaining-count').textContent = stats.remaining || 0;
                
                // 如果有需要复习的单词，显示提醒
                if (stats.today > 0) {
                    document.getElementById('review-count').textContent = stats.today;
                    document.getElementById('review-alert').style.display = 'block';
                }
            } catch (error) {
                console.error('加载统计失败:', error);
            }
        }
        
        // 页面加载时获取统计
        loadStats();
    </script>
</body>
</html>
