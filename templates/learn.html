<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎯 学习新单词 - 背单词</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }
        
        .back-btn {
            display: inline-block;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            background: rgba(255,255,255,0.2);
            border-radius: 20px;
            margin-bottom: 20px;
        }
        
        .back-btn:hover {
            background: rgba(255,255,255,0.3);
        }
        
        .card {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .word-card {
            text-align: center;
            padding: 30px 0;
        }
        
        .word {
            font-size: 3em;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
        }
        
        .phonetic {
            color: #666;
            font-size: 1.2em;
            margin-bottom: 30px;
        }
        
        .meaning {
            font-size: 1.5em;
            color: #667eea;
            margin-bottom: 20px;
            display: none;
        }
        
        .example {
            color: #888;
            font-style: italic;
            margin-top: 20px;
            display: none;
        }
        
        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }
        
        .btn {
            padding: 15px 40px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1em;
            transition: all 0.3s;
        }
        
        .btn-show {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-know {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }
        
        .btn-forget {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }
        
        .relearn-badge {
            display: inline-block;
            background: #f5576c;
            color: white;
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 0.8em;
            margin-bottom: 15px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .progress {
            text-align: center;
            color: white;
            margin-top: 20px;
        }
        
        .message {
            text-align: center;
            color: white;
            font-size: 1.5em;
            padding: 40px;
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/books" class="back-btn">← 返回词书</a>
        
        <header>
            <h1>🎯 学习新单词</h1>
            <p>每天进步一点点</p>
        </header>
        
        <div class="card" id="word-card">
            <div class="word-card">
                <div class="relearn-badge hidden" id="relearn-badge">🔁 重学单词</div>
                <div class="word" id="word">加载中...</div>
                <div class="phonetic" id="phonetic"></div>
                <div class="meaning" id="meaning"></div>
                <div class="example" id="example"></div>
            </div>
            
            <div class="btn-group" id="btn-group">
                <button class="btn btn-show" onclick="showMeaning()">显示释义</button>
            </div>
            
            <div class="btn-group hidden" id="answer-group">
                <button class="btn btn-forget" onclick="completeLearning(false)">不认识</button>
                <button class="btn btn-know" onclick="completeLearning(true)">认识</button>
            </div>
        </div>
        
        <div class="message hidden" id="complete-message">
            🎉 太棒了！<br>
            <p style="font-size: 0.8em; margin-top: 20px;">你已经学完这本词书的所有单词！</p>
            <a href="/books" class="btn btn-show" style="margin-top: 20px; display: inline-block; text-decoration: none;">选择其他词书</a>
        </div>
        
        <div class="progress" id="progress"></div>
    </div>
    
    <script>
        let currentWord = null;
        let learnedCount = 0;
        const bookId = {{ book_id }};
        
        // 加载下一个单词
        async function loadNextWord() {
            try {
                const response = await fetch('/api/learn/next', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ book_id: bookId })
                });
                
                const data = await response.json();
                
                if (data.message) {
                    // 学完了
                    document.getElementById('word-card').style.display = 'none';
                    document.getElementById('btn-group').style.display = 'none';
                    document.getElementById('answer-group').classList.add('hidden');
                    document.getElementById('complete-message').classList.remove('hidden');
                    document.getElementById('progress').textContent = '';
                    return;
                }
                
                currentWord = data;
                document.getElementById('word').textContent = data.word;
                document.getElementById('phonetic').textContent = data.phonetic || '';
                document.getElementById('meaning').textContent = data.meaning;
                document.getElementById('example').textContent = data.example || '';
                
                // 显示重学徽章
                const relearnBadge = document.getElementById('relearn-badge');
                if (data.is_relearn) {
                    relearnBadge.classList.remove('hidden');
                } else {
                    relearnBadge.classList.add('hidden');
                }
                
                // 重置显示状态
                document.getElementById('meaning').style.display = 'none';
                document.getElementById('example').style.display = 'none';
                document.getElementById('btn-group').classList.remove('hidden');
                document.getElementById('answer-group').classList.add('hidden');
                
                learnedCount++;
                document.getElementById('progress').textContent = `已学习：${learnedCount} 个单词`;
                
            } catch (error) {
                console.error('加载单词失败:', error);
                document.getElementById('word').textContent = '加载失败';
            }
        }
        
        // 显示释义
        function showMeaning() {
            document.getElementById('meaning').style.display = 'block';
            if (document.getElementById('example').textContent) {
                document.getElementById('example').style.display = 'block';
            }
            document.getElementById('btn-group').classList.add('hidden');
            document.getElementById('answer-group').classList.remove('hidden');
        }
        
        // 完成学习（认识/不认识）
        async function completeLearning(known) {
            if (!currentWord) return;
            
            try {
                // 根据认识/不认识调用不同 API
                const endpoint = known ? '/api/learn/known' : '/api/learn/unknown';
                
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        word_id: currentWord.id,
                        book_id: bookId
                    })
                });
                
                if (response.ok) {
                    // 加载下一个单词
                    loadNextWord();
                }
            } catch (error) {
                console.error('保存学习记录失败:', error);
            }
        }
        
        // 页面加载时获取第一个单词
        loadNextWord();
        
        // 空格键显示释义
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !document.getElementById('btn-group').classList.contains('hidden')) {
                e.preventDefault();
                showMeaning();
            }
        });
    </script>
</body>
</html>
